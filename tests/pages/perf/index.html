<body style="margin:0;background:#000;color:#fff;font:40px monospace"><div id=d>0</div><script>
// a shader-style clock: the work reads performance.now() itself every frame (Han's works do this for u_time)
let n=0;const t0=performance.now();function f(){n++;const now=performance.now();document.getElementById('d').textContent='frame '+n+' now='+now.toFixed(3)+' start='+t0.toFixed(3);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body>
